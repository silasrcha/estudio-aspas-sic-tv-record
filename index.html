:root {
  --azul-vivo:    #008EE0;
  --azul-escuro:  #123C90;
  --verde:        #4EA21D;
  --amarelo:      #FCD700;

  /* mesma paleta dos outros estúdios */
  --ground:    #0B121E;
  --surface:   #101A2A;
  --surface-2: #16233A;
  --line:      #1E2E47;
  --ink:       #EAF0F7;
  --ink-2:     #B6C2D2;
  --ink-3:     #8296B2;
  --accent:      #0069B3;
  --accent-ink:  #FFFFFF;
  --accent-soft: #16233A;
  --ok:        #52AE32;
  --erro:      #E5484D;
  --stage:     #080D16;
  --hachura: repeating-linear-gradient(135deg,#ffffff08 0 1px,transparent 1px 7px);
}

/* Interface em Encode Sans, como os outros estúdios. O card fica em Work Sans:
   é a tipografia do tweet, e trocar mudaria a quebra de linha medida no Figma. */
body {
  margin: 0;
  background: var(--ground);
  background-image: var(--hachura);
  color: var(--ink);
  font-family: "Encode Sans", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.faixa { display: flex; height: 6px; }
.faixa i { display: block; height: 100%; }
.faixa i:nth-child(1) { flex: 261; background: var(--verde); }
.faixa i:nth-child(2) { flex: 207; background: var(--amarelo); }
.faixa i:nth-child(3) { flex: 96;  background: #FFFFFF; }
.faixa i:nth-child(4) { flex: 244; background: var(--azul-escuro); }

header {
  position: relative;
  padding: 20px 28px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}
header .selo {
  margin-left: auto;
  font: 500 10px/1 "Encode Sans Condensed", sans-serif;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3);
}
h1 { margin: 0; display: flex; align-items: baseline; gap: .4em; line-height: 1.1; flex-wrap: wrap; }
h1 .g {
  font-family: 'Encode Sans Expanded', system-ui, sans-serif;
  font-weight: 700; font-size: 27px; letter-spacing: .005em; color: #FFFFFF;
}
h1 .dc {
  font-family: 'Encode Sans SC', system-ui, sans-serif;
  font-weight: 400; font-size: 25px; letter-spacing: .05em; color: var(--azul-vivo);
}
header p { margin: 0; color: var(--ink-3); font-size: 12.5px; }
header .voltar{align-self:center;display:inline-flex;align-items:center;gap:6px;
  padding:5px 9px;border:1px solid var(--line);border-radius:6px;text-decoration:none;
  white-space:nowrap;font:600 9.5px/1 "Encode Sans Condensed",sans-serif;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  transition:color .15s,border-color .15s,background .15s}
header .voltar:hover{color:var(--ink);border-color:var(--accent);background:#ffffff0d}
header .voltar svg{width:11px;height:11px;fill:currentColor;flex:none}

main {
  display: grid;
  grid-template-columns: 400px minmax(0, 1fr);
  align-items: start;
  min-height: calc(100vh - 72px);
}

.painel {
  padding: 24px 28px 64px;
  border-right: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 26px;
}
.campo { display: flex; flex-direction: column; gap: 9px; }

.rot {
  font-size: 11.5px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-3);
}

textarea {
  width: 100%; box-sizing: border-box;
  font: inherit; font-size: 14.5px; color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px;
  resize: vertical; min-height: 132px; line-height: 1.45;
}
textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.linha-cores { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.linha-cores .qual { flex: none; min-width: 78px; font-size: 12px; color: var(--ink-3); }
.cores { display: flex; gap: 7px; flex-wrap: wrap; }
.cores button { width: 26px; height: 26px; padding: 0; cursor: pointer;
  border-radius: 6px; border: 2px solid transparent;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.4); transition: border-color .12s; }
.cores button:hover { border-color: var(--ink-3); }
.cores button.on { border-color: var(--accent); }
.cores button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.opcoes { display: flex; flex-direction: column; gap: 6px; }
.opcoes.linha { flex-direction: row; gap: 8px; }
.opcoes.linha .op { flex: 1; justify-content: center; }

.op {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface-2);
  cursor: pointer; font-size: 14px; user-select: none;
}
.op:hover { border-color: var(--ink-3); }
.op input { position: absolute; opacity: 0; pointer-events: none; }
.op:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.op:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
/* miniatura do modelo: a cor de fundo do card com a barra de cores no rodapé */
.op .mini { flex: none; width: 30px; height: 22px; border-radius: 0 4px 4px 4px; position: relative; overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.op .mini::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
  background: linear-gradient(90deg,#008EE0 0 30%,#006DD7 30% 42%,#FCD700 42% 68%,#4EA21D 68% 100%); }

.range { display: flex; align-items: center; gap: 12px; }
input[type="range"] { flex: 1; accent-color: var(--accent); }
.valor {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px; color: var(--ink-3);
  min-width: 46px; text-align: right; font-variant-numeric: tabular-nums;
}

.dropzone {
  border: 1.5px dashed var(--line); border-radius: 10px;
  padding: 18px; text-align: center;
  color: var(--ink-3); font-size: 13.5px; cursor: pointer;
  background: var(--surface-2);
}
.dropzone:hover, .dropzone.ativo { border-color: var(--accent); color: var(--ink-2); }
.dropzone strong { color: var(--ink); font-weight: 600; display: block; font-size: 14px; margin-bottom: 2px; }

.check { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }

button.principal {
  font: inherit; font-size: 15px; font-weight: 600;
  background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 9px;
  padding: 13px 18px; cursor: pointer; width: 100%;
}
button.principal:hover { filter: brightness(1.08); }
button.principal:disabled { opacity: .45; cursor: not-allowed; }
button.principal:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.aviso { font-size: 12.5px; color: var(--ink-3); margin: 0; }
.aviso.erro { color: var(--erro); }
.aviso.ok { color: var(--ok); font-weight: 500; }

.palco {
  background: var(--stage);
  background-image: var(--hachura);
  padding: 32px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  position: sticky; top: 0;
  min-height: calc(100vh - 72px);
}
.moldura {
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
  border-radius: 3px; overflow: hidden; line-height: 0; max-width: 100%;
}
canvas#tela {
  display: block; max-width: 100%;
  max-height: calc(100vh - 190px);
  width: auto; height: auto;
  cursor: grab; touch-action: none;
}
canvas#tela.arrastando { cursor: grabbing; }
.legenda-palco {
  color: rgba(255,255,255,.55);
  font-size: 12.5px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-variant-numeric: tabular-nums; text-align: center;
}

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  .painel { border-right: 0; border-bottom: 1px solid var(--line); order: 2; padding: 20px 16px 48px; }
  .palco { order: 1; position: static; min-height: 0; padding: 20px 16px; }
  canvas#tela { max-height: 58vh; }
  header { padding: 16px; }
}
</style>
</head>

<header>
  <h1><span class="g">ASPAS</span><span class="dc">SIC TV RECORD</span></h1>
  <p>Cole o texto, escolha a cor, envie a foto e baixe pronto.</p>
  <span class="selo">MR 22</span>
  <a class="voltar" href="https://silasrcha.github.io/painel-estudios/" target="_blank" rel="noopener" title="Abre o painel com todos os estúdios numa nova guia"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h5v5H2V2zm7 0h5v5H9V2zM2 9h5v5H2V9zm7 0h5v5H9V9z"/></svg>Ferramentas</a>
</header>

<main>
  <section class="painel">

    <div class="campo">
      <span class="rot">Formato</span>
      <div class="opcoes linha" id="formatos"></div>
    </div>

    <div class="campo">
      <span class="rot">Modelo do card</span>
      <div class="opcoes" id="modelos"></div>
    </div>

    <div class="campo">
      <label class="rot" for="texto">Texto</label>
      <textarea id="texto" spellcheck="true"></textarea>
      <p class="aviso" id="contador"></p>
    </div>

    <div class="campo">
      <span class="rot">Foto de fundo</span>
      <div class="dropzone" id="drop" tabindex="0" role="button">
        <strong id="dropTitulo">Escolher foto</strong>
        arraste aqui ou clique para procurar
      </div>
      <input type="file" id="arquivo" accept="image/*" hidden />
      <div class="range">
        <span class="rot" style="min-width:42px">Zoom</span>
        <input type="range" id="zoom" min="100" max="300" value="100" />
        <span class="valor" id="zoomVal">100%</span>
      </div>
      <p class="aviso">Arraste a foto na prévia para reposicionar.</p>
    </div>

    <div class="campo">
      <span class="rot">Posição do card</span>
      <div class="range">
        <input type="range" id="posy" min="0" max="100" value="80" />
        <span class="valor" id="posyVal">80%</span>
      </div>
      <span class="rot">Tamanho do card</span>
      <div class="range">
        <input type="range" id="escala" min="90" max="135" value="112" />
        <span class="valor" id="escalaVal">112%</span>
      </div>
      <label class="check"><input type="checkbox" id="sombra" checked /> Sombra suave sob o card</label>
    </div>

    <div class="campo">
      <label class="check"><input type="checkbox" id="temlegenda" checked /> Legenda eleitoral</label>
      <textarea id="legenda" style="min-height:64px;font-size:13px"></textarea>
      <div class="linha-cores"><span class="qual">Cor</span><div class="cores" id="coresLegenda"></div></div>
      <label class="check"><input type="checkbox" id="legsombra" /> Sombra na legenda</label>
    </div>

    <div class="campo">
      <button class="principal" id="baixar">Baixar PNG</button>
      <p class="aviso" id="status"></p>
    </div>

  </section>

  <section class="palco">
    <div class="moldura"><canvas id="tela" width="1080" height="1920"></canvas></div>
    <p class="legenda-palco" id="infoTela"></p>
  </section>
</main>

        while (ctx.measureText(atual).width > larg && atual.length > 1) {
          var corte = atual.length - 1;
          while (corte > 1 && ctx.measureText(atual.slice(0, corte)).width > larg) corte--;
          linhas.push(atual.slice(0, corte));
          atual = atual.slice(corte);
        }
      }
      linhas.push(atual);
    }
    return linhas;
  }

  // meia-entrelinha: replica como o Figma centraliza a linha na altura de linha
  function baseDaLinha(fonte, alturaLinha) {
    ctx.font = fonte;
    var m = ctx.measureText('Hxjgy');
    var asc = m.fontBoundingBoxAscent, desc = m.fontBoundingBoxDescent;
    if (!isFinite(asc) || !isFinite(desc)) { asc = parseFloat(fonte) * 0.98; desc = parseFloat(fonte) * 0.25; }
    return (alturaLinha - (asc + desc)) / 2 + asc;
  }

  function linhasTexto() { return quebrar(st.texto, TXT_W, fonteTexto(), LS_TXT); }

  function alturaCard() {
    return PAD_T + HEADER_H + GAP_TXT + linhasTexto().length * TXT_LH + PAD_B;
  }

  /* ---------- card ---------- */
  // canto de cima à esquerda reto (é de onde sai o bico), os outros com raio
  function caminhoCard(w, h, r) {
    ctx.moveTo(0, 0);
    ctx.lineTo(w - r, 0);
    ctx.arcTo(w, 0, w, r, r);
    ctx.lineTo(w, h - r);
    ctx.arcTo(w, h, w - r, h, r);
    ctx.lineTo(r, h);
    ctx.arcTo(0, h, 0, h - r, r);
    ctx.closePath();
  }
  // o bico entra no MESMO caminho do card (os dois no sentido horário, então
  // somam): uma sombra só para o balão inteiro, sem escurecer o card por cima
  function caminhoBico() {
    ctx.moveTo(BICO[0][0], BICO[0][1]);
    ctx.lineTo(BICO[1][0], BICO[1][1]);
    ctx.lineTo(BICO[2][0], BICO[2][1]);
    ctx.closePath();
  }

  function circulo(im, x, y, d) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x + d / 2, y + d / 2, d / 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(im, x, y, d, d);
    ctx.restore();
  }

  // escreve uma linha do cabeçalho na altura de linha de 32 do Figma
  function linhaCab(txt, peso, ls, cor, x, topo, alinhar) {
    var f = peso + ' ' + NOME_SIZE + 'px "Work Sans"';
    var base = baseDaLinha(f, LINHA_NOME);
    usarFonte(f, ls);
    ctx.fillStyle = cor;
    ctx.textAlign = alinhar;
    // o canvas soma a entreletra depois da última letra; alinhado à direita
    // isso empurra a tinta para fora da borda, então desconta
    if (alinhar === 'right') x += parseFloat(ls);
    ctx.fillText(txt, x, topo + base);
    ctx.textAlign = 'left';
  }

  function desenharCard(px, py, H, k) {
    var m = mod();

    // desenha em medidas nativas e escala o conjunto: a quebra de linha não muda
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(k, k);

    // corpo + bico
    ctx.save();
    ctx.beginPath();
    caminhoCard(CARD_W, H, RAIO);
    caminhoBico();
    if (st.sombra) {
      ctx.shadowColor = 'rgba(6,18,38,.30)';
      ctx.shadowBlur = 42;
      ctx.shadowOffsetY = 14;
    }
    ctx.fillStyle = m.fundo;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    // barra deitada no rodapé, recortada pelos cantos arredondados de baixo
    ctx.beginPath();
    caminhoCard(CARD_W, H, RAIO);
    ctx.clip();
    var bx = 0;
    for (var j = 0; j < BARRA.length; j++) {
      ctx.fillStyle = BARRA[j][1];
      ctx.fillRect(bx, H - BARRA_H, BARRA[j][0] + 0.5, BARRA_H);
      bx += BARRA[j][0];
    }
    ctx.restore();

    // texto em cima
    var linhas = linhasTexto();
    var fTxt = fonteTexto();
    var base = baseDaLinha(fTxt, TXT_LH);
    usarFonte(fTxt, LS_TXT);
    ctx.fillStyle = m.texto;
    for (var i = 0; i < linhas.length; i++) {
      ctx.fillText(linhas[i], PAD_L, PAD_T + i * TXT_LH + base);
    }

    // cabeçalho embaixo: perfil à esquerda, veículo encostado à direita
    var topo = PAD_T + linhas.length * TXT_LH + GAP_TXT;
    ctx.textBaseline = 'alphabetic';
    circulo(avatar, PAD_L, topo, AVATAR);
    linhaCab(NOME,    600, LS_LINHA1, m.nome1,   NOME_X,    topo + NOME_DY,   'left');
    linhaCab(ARROBA,  400, LS_LINHA2, m.arroba,  NOME_X,    topo + ARROBA_DY, 'left');
    linhaCab(DEBATE,  600, LS_LINHA1, m.debate,  BORDA_DIR, topo + NOME_DY,   'right');
    linhaCab(VEICULO, 400, LS_LINHA2, m.veiculo, BORDA_DIR, topo + ARROBA_DY, 'right');

    ctx.restore();
  }

  /* ---------- foto ---------- */
  function limitesFoto() {
    var f = fmt();
    var im = st.foto;
    var s = Math.max(f.w / im.width, f.h / im.height) * st.zoom;
    var dw = im.width * s, dh = im.height * s;
    return { dw: dw, dh: dh, minX: f.w - dw, minY: f.h - dh };
  }

  function ajustarPan() {
    if (!st.foto) return;
    var L = limitesFoto();
    st.panX = Math.min(0, Math.max(L.minX, st.panX));
    st.panY = Math.min(0, Math.max(L.minY, st.panY));
  }

  function desenharFundo() {
    var f = fmt();
    if (st.foto) {
      var L = limitesFoto();
      ctx.drawImage(st.foto, st.panX, st.panY, L.dw, L.dh);
    } else {
      var g = ctx.createLinearGradient(0, 0, 0, f.h);
      g.addColorStop(0, '#2A3340');
      g.addColorStop(1, '#151A21');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, f.w, f.h);
      ctx.fillStyle = 'rgba(255,255,255,.28)';
      usarFonte('400 34px "Work Sans"', '0px');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('envie uma foto', f.w / 2, f.h * 0.28);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }
  }

  /* Story: legenda de pé na lateral direita. Feed: deitada no rodapé, como o
     referência do Figma (2476:785) — caixa de 907 × 20 em x=87, y=1418. */
  /* No Figma a caixa abraça o texto (907 é a largura do texto de lá, não um
     limite): uma linha só a partir de x=87. Quebra só se chegar a 40 da borda. */
  var LEGENDA_FEED = { x: 87, larg: 1080 - 87 - 40, y: 1418, alt: 20, fonte: '400 17px Arial', ls: '0px' };

  function desenharLegenda() {
    var f = fmt();
    ctx.save();
    /* sombra da cor oposta ao texto, duas passadas para o halo ficar denso */
    var passos = st.legendaSombra ? 2 : 1;
    if (st.legendaSombra) {
      ctx.shadowColor = (st.legendaCor === '#FFFFFF') ? 'rgba(0,0,0,.85)' : 'rgba(255,255,255,.9)';
      ctx.shadowBlur = 5;
    }
    ctx.fillStyle = st.legendaCor;
    if (st.formato === 'feed') {
      var g = LEGENDA_FEED;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      var lin = quebrar(st.legenda, g.larg, g.fonte, g.ls);
      var base = g.y + g.alt / 2;
      for (var pf = 0; pf < passos; pf++)
        for (var j = 0; j < lin.length; j++)
          ctx.fillText(lin[j], g.x, base - (lin.length - 1 - j) * g.alt);
    } else {
      ctx.translate(f.w - 24, f.h / 2);
      ctx.rotate(Math.PI / 2);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      var linhas = quebrar(st.legenda, f.h - 120, '400 17px "Work Sans"', '0px');
      for (var ps = 0; ps < passos; ps++)
        for (var i = 0; i < linhas.length; i++) ctx.fillText(linhas[i], 0, i * 21);
    }
    ctx.restore();
  }

  /* ---------- render ---------- */
  function desenhar() {
    if (!pronto) return;
    var f = fmt();
    if (cv.width !== f.w || cv.height !== f.h) { cv.width = f.w; cv.height = f.h; }
    ctx.clearRect(0, 0, f.w, f.h);

    ajustarPan();
    desenharFundo();

    var H = alturaCard();
    var k = st.escala;
    var lg = CARD_W * k, alt = H * k;
    var cx = Math.round((f.w - lg) / 2);
    // o bico sobe acima do card: reserva o espaço dele para não sair da tela
    var acima = BICO_ACIMA * k;
    var cy = Math.round(acima + st.posy * (f.h - alt - acima));
    desenharCard(cx, cy, H, k);

    if (st.legendaOn && st.legenda.trim()) desenharLegenda();

    var n = linhasTexto().length;
    $('infoTela').textContent = f.w + ' × ' + f.h + '  ·  card ' + Math.round(lg) + ' × ' + Math.round(alt) +
      (k !== 1 ? ' (' + Math.round(k * 100) + '%)' : '') + '  ·  ' + n + (n === 1 ? ' linha' : ' linhas');
    $('contador').textContent = st.texto.length + ' caracteres · ' + n + (n === 1 ? ' linha' : ' linhas') + ' no card';
  }

  /* ---------- controles ---------- */
  function montarControles() {
    var cf = $('formatos');
    FORMATOS.forEach(function (f) {
      var l = document.createElement('label');
      l.className = 'op';
      l.innerHTML = '<input type="radio" name="formato" value="' + f.id + '"' + (f.id === st.formato ? ' checked' : '') + ' /> ' +
                    f.nome + ' <span class="valor">' + f.w + '×' + f.h + '</span>';
      l.querySelector('input').addEventListener('change', function () {
        st.formato = f.id; st.panX = 0; st.panY = 0; desenhar();
      });
      cf.appendChild(l);
    });

    var cm = $('modelos');
    MODELOS.forEach(function (m) {
      var l = document.createElement('label');
      l.className = 'op';
      l.innerHTML = '<input type="radio" name="modelo" value="' + m.id + '"' + (m.id === st.modelo ? ' checked' : '') + ' />' +
                    '<span class="mini" style="background:' + m.fundo + '"></span>' + m.nome;
      l.querySelector('input').addEventListener('change', function () { st.modelo = m.id; desenhar(); });
      cm.appendChild(l);
    });

    montarCoresLegenda();
    $('legsombra').checked = st.legendaSombra;
    $('legsombra').addEventListener('change', function () { st.legendaSombra = this.checked; desenhar(); });

    $('texto').value = st.texto;
    $('legenda').value = st.legenda;
    $('texto').addEventListener('input', function () { st.texto = this.value; desenhar(); });
    $('legenda').addEventListener('input', function () { st.legenda = this.value; desenhar(); });
    $('temlegenda').addEventListener('change', function () { st.legendaOn = this.checked; desenhar(); });

    $('zoom').addEventListener('input', function () {
      st.zoom = this.value / 100;
      $('zoomVal').textContent = this.value + '%';
      desenhar();
    });
    $('posy').addEventListener('input', function () {
      st.posy = this.value / 100;
      $('posyVal').textContent = this.value + '%';
      desenhar();
    });
    $('escala').addEventListener('input', function () {
      st.escala = this.value / 100;
      $('escalaVal').textContent = this.value + '%';
      desenhar();
    });
    $('sombra').addEventListener('change', function () { st.sombra = this.checked; desenhar(); });

    ligarArquivo();
    ligarArraste();
    $('baixar').addEventListener('click', baixar);
  }

  /* Só branco e preto: a legenda é exigência legal e precisa ler sobre qualquer foto. */
  var CORES_LEGENDA = [{ nome: 'Branco', cor: '#FFFFFF' }, { nome: 'Preto', cor: '#000000' }];
  function montarCoresLegenda() {
    var caixa = $('coresLegenda');
    caixa.innerHTML = '';
    CORES_LEGENDA.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.style.background = c.cor;
      b.title = c.nome;
      b.setAttribute('aria-label', c.nome);
      b.className = (st.legendaCor === c.cor) ? 'on' : '';
      b.addEventListener('click', function () {
        st.legendaCor = c.cor;
        caixa.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        desenhar();
      });
      caixa.appendChild(b);
    });
  }

  function ligarArquivo() {
    var drop = $('drop'), inp = $('arquivo');
    drop.addEventListener('click', function () { inp.click(); });
    drop.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); }
    });
    inp.addEventListener('change', function () { if (this.files && this.files[0]) usarArquivo(this.files[0]); });

    ['dragenter', 'dragover'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('ativo'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('ativo'); });
    });
    drop.addEventListener('drop', function (e) {
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) usarArquivo(f);
    });
  }

  function usarArquivo(file) {
    if (!/^image\//.test(file.type)) {
      $('status').textContent = 'Esse arquivo não é uma imagem. Use JPG, PNG ou WebP.';
      $('status').className = 'aviso erro';
      return;
    }
    var fr = new FileReader();
    fr.onload = function () {
      carregaImg(fr.result).then(function (im) {
        st.foto = im;
        st.panX = 0; st.panY = 0;
        st.zoom = 1;
        $('zoom').value = 100;
        $('zoomVal').textContent = '100%';
        $('dropTitulo').textContent = file.name.length > 30 ? file.name.slice(0, 28) + '…' : file.name;
        $('status').textContent = '';
        $('status').className = 'aviso';
        desenhar();
      });
    };
    fr.readAsDataURL(file);
  }

  function ligarArraste() {
    var ativo = false, ox = 0, oy = 0, px = 0, py = 0;
    cv.addEventListener('pointerdown', function (e) {
      if (!st.foto) return;
      ativo = true;
      cv.classList.add('arrastando');
      cv.setPointerCapture(e.pointerId);
      ox = e.clientX; oy = e.clientY; px = st.panX; py = st.panY;
    });
    cv.addEventListener('pointermove', function (e) {
      if (!ativo) return;
      var escala = cv.width / cv.getBoundingClientRect().width;
      st.panX = px + (e.clientX - ox) * escala;
      st.panY = py + (e.clientY - oy) * escala;
      desenhar();
    });
    ['pointerup', 'pointercancel'].forEach(function (ev) {
      cv.addEventListener(ev, function () { ativo = false; cv.classList.remove('arrastando'); });
    });
  }

  /* ---------- download ---------- */
  function nomeArquivo() {
    var base = st.texto.trim().split(/\s+/).slice(0, 4).join('-')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-zA-Z0-9-]/g, '').toLowerCase() || 'card';
    return 'mr-sictv-' + st.formato + '-' + st.modelo + '-' + base + '.png';
  }

  function baixar() {
    var btn = $('baixar'), s = $('status');
    btn.disabled = true;
    s.className = 'aviso';
    s.textContent = 'Gerando…';
    cv.toBlob(function (blob) {
      btn.disabled = false;
      if (!blob) {
        s.textContent = 'Não consegui gerar a imagem. Tente de novo.';
        s.className = 'aviso erro';
        return;
      }
      var nome = nomeArquivo();
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = nome;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      s.textContent = 'Salvo como ' + nome;
      s.className = 'aviso ok';
    }, 'image/png');
  }

  iniciar();
})();
</script>
</body>
</html>
